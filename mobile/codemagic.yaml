# Template only. Boston must create a free Codemagic account, connect this repo,
# and add App Store Connect signing in the Codemagic UI. Do not put secrets here.
workflows:
  kandi_ios:
    name: Kandi iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: kandi
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.marshandbarb.kandi
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      cocoapods: default
      xcode: latest
    working_directory: mobile
    scripts:
      - name: Install JS deps
        script: |
          npm ci || npm install
      - name: Sync Capacitor
        script: |
          npx cap sync ios
      - name: CocoaPods
        script: |
          cd ios/App && pod install
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  kandi_android:
    name: Kandi Android (Play internal)
    instance_type: linux_x2
    max_build_duration: 45
    working_directory: mobile
    environment:
      java: 17
    scripts:
      - name: Install JS deps
        script: |
          npm ci || npm install
      - name: Sync Capacitor
        script: |
          npx cap sync android
      - name: Build AAB
        script: |
          cd android && ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
