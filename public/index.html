<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kandi" />
  <meta name="application-name" content="Kandi" />
  <meta name="theme-color" content="#000000" />
  <meta name="msapplication-TileColor" content="#000000" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
  <link rel="apple-touch-startup-image" href="/splashes/iphone-1290.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
  <link rel="apple-touch-startup-image" href="/splashes/iphone-1179.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
  <link rel="apple-touch-startup-image" href="/splashes/iphone-1284.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3)" />
  <link rel="apple-touch-startup-image" href="/splashes/iphone-1170.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
  <link rel="apple-touch-startup-image" href="/splashes/iphone-1125.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
  <title>Kandi</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script>
    // Boot watchdog: if the app script never starts (bad network, stale cache), offer a clean reload instead of a frozen black screen.
    setTimeout(function () {
      if (window.__kandiBooted) return;
      var a = document.getElementById("app");
      if (!a) return;
      a.innerHTML = '<div style="color:#fff;font-family:-apple-system,system-ui,sans-serif;text-align:center;padding:120px 24px"><h1 style="color:#ff6a00;margin:0 0 12px">Kandi</h1><p>Kandi is taking too long to load.</p><button id="kandi-reload" style="margin-top:18px;padding:14px 28px;border:0;border-radius:14px;background:#ff5c00;color:#fff;font-size:16px;font-weight:700">Reload</button></div>';
      document.getElementById("kandi-reload").onclick = function () {
        var go = function () { location.reload(); };
        try {
          var jobs = [];
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          Promise.all(jobs).then(go, go); setTimeout(go, 2500);
        } catch (e) { go(); }
      };
    }, 20000);
  </script>
  <script src="/app.js" defer></script>
</body>
</html>
