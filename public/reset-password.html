<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="no-referrer" />
  <title>Reset your password · Kandi</title>
  <link rel="stylesheet" href="/account-pages.css" />
</head>
<body>
<main>
  <p class="wordmark">Kandi</p>
  <div id="page" data-page="reset">
    <h1>Choose a new password</h1>
    <p>Pick something with at least 8 characters.</p>
    <form id="reset-form" autocomplete="on">
      <input type="text" name="username" autocomplete="username" style="display:none" aria-hidden="true" tabindex="-1" />
      <input id="pw1" type="password" autocomplete="new-password" placeholder="New password (8+ characters)" aria-label="New password" required minlength="8" />
      <input id="pw2" type="password" autocomplete="new-password" placeholder="Type it again" aria-label="Confirm new password" required minlength="8" />
      <div id="msg" class="err" role="alert"></div>
      <button id="go" class="btn" type="submit">Save new password</button>
    </form>
  </div>
  <p class="tiny"><a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · <a href="/support">Support</a></p>
</main>
<script src="/account-pages.js"></script>
</body>
</html>
