<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="no-referrer" />
  <title>Confirm your email · Kandi</title>
  <style>
    html,body{margin:0;background:#000;color:#fff7f0;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    main{max-width:420px;margin:0 auto;padding:calc(56px + env(safe-area-inset-top)) 22px calc(48px + env(safe-area-inset-bottom));text-align:center}
    .wordmark{font-size:40px;font-weight:800;letter-spacing:-0.03em;background:linear-gradient(90deg,#ff8a1a,#ff5c00);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
    h1{font-size:22px;margin:22px 0 8px}
    p{color:#c8b8aa;margin:8px 0}
    .btn{display:block;width:100%;box-sizing:border-box;height:52px;line-height:52px;margin-top:18px;border:0;border-radius:999px;background:linear-gradient(90deg,#ff8a1a,#ff5c00);color:#fff;font:700 16px/52px -apple-system,sans-serif;text-decoration:none;cursor:pointer}
    .btn[disabled]{opacity:.55}
    .ghost{background:transparent;border:1px solid #3a2a1c;color:#fff7f0}
    input{display:block;width:100%;box-sizing:border-box;height:52px;margin-top:12px;padding:0 16px;border-radius:14px;border:1px solid #3a2a1c;background:#111;color:#fff7f0;font-size:16px}
    .err{color:#ff6b5a;margin-top:12px}
    .ok{color:#7be29b}
    .spin{display:inline-block;width:18px;height:18px;border:2px solid #ff8a1a;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-3px;margin-right:6px}
    @keyframes s{to{transform:rotate(360deg)}}
    .tiny{font-size:13px;color:#8a7a6c;margin-top:28px}
    .tiny a{color:#8a7a6c}
  </style>
</head>
<body>
<main>
  <p class="wordmark">Kandi</p>
  <div id="page" data-page="verify">
    <h1>Confirming your email…</h1>
    <p><span class="spin"></span>One sec.</p>
  </div>
  <noscript><p>Turn on JavaScript to confirm your email.</p></noscript>
  <p class="tiny"><a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> · <a href="/support">Support</a></p>
</main>
<script src="/account-pages.js"></script>
</body>
</html>
