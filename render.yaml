# Kandi on Render's Free web service.
# Data must live in Neon (or another hosted Postgres) because Free web
# services have no persistent disk — a local SQLite file would be wiped
# every time the service sleeps or redeploys.
services:
  - type: web
    name: kandi
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SEED_ON_BOOT
        value: "1"
      - key: KANDI_SECRET
        generateValue: true
      # Paste your Neon (or other Postgres) connection string in the dashboard.
      # Prefer the direct (non-pooler) URI for this long-running server.
      - key: DATABASE_URL
        sync: false
      # Stripe website billing (optional). Leave unset until keys are ready.
      # Webhook URL: https://<this-service>.onrender.com/api/stripe/webhook
      # Events: checkout.session.completed, customer.subscription.updated,
      #         customer.subscription.deleted, invoice.payment_failed
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_IDS
        sync: false
      - key: KANDI_PUBLIC_URL
        sync: false
