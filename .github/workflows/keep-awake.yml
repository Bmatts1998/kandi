name: Keep Render awake

# Public repo: scheduled runs on standard GitHub-hosted runners are free.
# Render's free web service sleeps after ~15 minutes idle, so ping often.
# GitHub cron can run late, so this is every 5 minutes rather than 10.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Kandi
        run: |
          set -euo pipefail
          url="https://kandi-6rih.onrender.com/healthz"
          for i in 1 2 3 4 5; do
            echo "Attempt $i"
            if curl -fsS --max-time 45 -o /tmp/health -w "status=%{http_code} time=%{time_total}s\n" "$url"; then
              cat /tmp/health
              echo
              exit 0
            fi
            echo "Ping failed, retrying..."
            sleep 8
          done
          echo "Health check failed after retries"
          exit 1
